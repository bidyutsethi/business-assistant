<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tasks — Business Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;750&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="app-auth.js"></script>
</head>
<body data-page="tasks.html">
<div class="app-shell">
  <aside class="app-sidebar" id="appSidebar"></aside>

  <main class="app-main">
    <div class="app-topbar">
      <div style="font-weight:700;font-size:15px;">Tasks</div>
      <div class="topbar-actions">
        <button class="icon-btn" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg><span class="badge"></span></button>
        <div class="topbar-profile"><div class="avatar" data-user-initials>AM</div></div>
      </div>
    </div>

    <div class="page-body">
      <div class="page-head">
        <div>
          <h1>Tasks</h1>
          <p>Everything your team needs to follow up on.</p>
        </div>
        <button class="btn btn-primary btn-sm" id="addTaskBtn">+ Add Task</button>
      </div>

      <div class="panel">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr><th>Task</th><th>Status</th><th>Created</th><th></th></tr>
            </thead>
            <tbody id="tasksBody">
              <tr><td colspan="4"><div class="skeleton" style="height:16px;width:60%;">&nbsp;</div></td></tr>
              <tr><td colspan="4"><div class="skeleton" style="height:16px;width:50%;">&nbsp;</div></td></tr>
            </tbody>
          </table>
        </div>
        <div id="tasksEmpty" class="empty-state" hidden>
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></div>
          <h4>All caught up</h4>
          <p>No tasks right now. Add one when something needs following up.</p>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="taskModal">
  <div class="modal-box">
    <h3>Add Task</h3>
    <form id="taskForm">
      <div class="field">
        <label for="taskTitle">Task</label>
        <input type="text" id="taskTitle" required placeholder="Follow up with Europe renewals">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary btn-sm" id="taskCancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary btn-sm">Add Task</button>
      </div>
    </form>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>
<script src="script.js"></script>
<script src="app-shell.js"></script>
<script src="tasks.js"></script>
</body>
</html>
