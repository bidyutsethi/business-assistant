<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orders — Business Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;750&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="app-auth.js"></script>
</head>
<body data-page="orders.html">
<div class="app-shell">
  <aside class="app-sidebar" id="appSidebar"></aside>

  <main class="app-main">
    <div class="app-topbar">
      <div style="font-weight:700;font-size:15px;">Orders</div>
      <div class="topbar-actions">
        <button class="icon-btn" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg><span class="badge"></span></button>
        <div class="topbar-profile"><div class="avatar" data-user-initials>AM</div></div>
      </div>
    </div>

    <div class="page-body">
      <div class="page-head">
        <div>
          <h1>Orders</h1>
          <p>All orders across every customer and region.</p>
        </div>
        <button class="btn btn-primary btn-sm" id="addOrderBtn">+ New Order</button>
      </div>

      <div class="panel">
        <div class="table-toolbar">
          <div class="filter-pills" id="statusFilters">
            <button class="filter-pill active" data-status="">All</button>
            <button class="filter-pill" data-status="new">New</button>
            <button class="filter-pill" data-status="processing">Processing</button>
            <button class="filter-pill" data-status="fulfilled">Fulfilled</button>
            <button class="filter-pill" data-status="overdue">Overdue</button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr><th>Order</th><th>Customer</th><th>Region</th><th>Amount</th><th>Status</th><th>Date</th><th></th></tr>
            </thead>
            <tbody id="ordersBody">
              <tr><td colspan="7"><div class="skeleton" style="height:16px;width:60%;">&nbsp;</div></td></tr>
              <tr><td colspan="7"><div class="skeleton" style="height:16px;width:50%;">&nbsp;</div></td></tr>
            </tbody>
          </table>
        </div>
        <div id="ordersEmpty" class="empty-state" hidden>
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.4a2 2 0 002 1.6h9.72a2 2 0 002-1.6L23 6H6"/></svg></div>
          <h4>No orders found</h4>
          <p>Try a different filter, or create a new order.</p>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="orderModal">
  <div class="modal-box">
    <h3>New Order</h3>
    <form id="orderForm">
      <div class="field">
        <label for="orderCustomer">Customer</label>
        <select id="orderCustomer" required class="status-select" style="width:100%;padding:11px 12px;"></select>
      </div>
      <div class="field">
        <label for="orderAmount">Amount (USD)</label>
        <input type="number" id="orderAmount" required min="1" step="0.01" placeholder="1250.00">
      </div>
      <div class="field">
        <label for="orderStatus">Status</label>
        <select id="orderStatus" class="status-select" style="width:100%;padding:11px 12px;">
          <option value="new">New</option>
          <option value="processing">Processing</option>
          <option value="fulfilled">Fulfilled</option>
          <option value="overdue">Overdue</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary btn-sm" id="orderCancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary btn-sm">Create Order</button>
      </div>
    </form>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>
<script src="script.js"></script>
<script src="app-shell.js"></script>
<script src="orders.js"></script>
</body>
</html>
