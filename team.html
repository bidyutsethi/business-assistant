<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Team — Business Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;750&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="app-auth.js"></script>
</head>
<body data-page="team.html">
<div class="app-shell">
  <aside class="app-sidebar" id="appSidebar"></aside>

  <main class="app-main">
    <div class="app-topbar">
      <div style="font-weight:700;font-size:15px;">Team</div>
      <div class="topbar-actions">
        <button class="icon-btn" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg><span class="badge"></span></button>
        <div class="topbar-profile"><div class="avatar" data-user-initials>AM</div></div>
      </div>
    </div>

    <div class="page-body">
      <div class="page-head">
        <div>
          <h1>Team</h1>
          <p>Everyone with access to this Business Assistant workspace.</p>
        </div>
      </div>

      <div class="panel">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr><th>Name</th><th>Email</th><th>Company</th><th>Role</th><th>Joined</th></tr>
            </thead>
            <tbody id="teamBody">
              <tr><td colspan="5"><div class="skeleton" style="height:16px;width:60%;">&nbsp;</div></td></tr>
              <tr><td colspan="5"><div class="skeleton" style="height:16px;width:50%;">&nbsp;</div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <p style="font-size:12.5px;color:var(--slate-400);margin-top:14px;">This workspace doesn't yet separate accounts by company — every signed-up user appears here. Inviting teammates by email isn't wired up yet (it would need an email service configured).</p>
    </div>
  </main>
</div>

<div class="toast-stack" id="toastStack"></div>
<script src="script.js"></script>
<script src="app-shell.js"></script>
<script src="team.js"></script>
</body>
</html>
